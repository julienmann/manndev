<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mann/dev Process Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#1e2530; --surface:#252b34; --fg:#f0f2f4; --mid:#969ba6; --dim:#636872; --accent:#f2c94c;
  --rule:rgba(240,242,244,.09); --rule-accent:rgba(242,201,76,.22); --line:rgba(240,242,244,.14);
  --display:'Lora', Georgia, serif; --body:'Figtree', system-ui, sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body)}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:16px;padding-inline:16px}
.vp{position:relative;overflow:hidden;border-radius:18px;background:var(--bg);box-shadow:0 0 0 1px var(--rule);flex:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;font-family:var(--body);color:var(--fg)}
.a{position:absolute}
.lbl{font:600 18px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--mid)}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.wi{display:inline-block}
.sp{display:inline-block;width:.26em}
.line{display:block;white-space:nowrap}
.serif{font-family:var(--display);font-weight:500;letter-spacing:-.01em;line-height:1.08}
/* header */
#rule{left:160px;top:130px;width:1600px;height:1px;background:var(--rule);transform-origin:0 50%}
/* left column */
#numwin{left:160px;top:160px;height:190px;overflow:hidden}
#numcol{font:700 190px/190px var(--display);color:var(--accent)}
#numcol div{height:190px}
#txt{left:160px;top:392px;width:720px;display:flex;flex-direction:column;align-items:flex-start;gap:26px}
#title{font-size:78px}
#body{font:400 31px/1.55 var(--body);color:var(--mid);max-width:640px}
.tag{font:600 17px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--accent);border:1.5px solid var(--rule-accent);padding:12px 18px;border-radius:6px}
#badge{left:160px;top:290px;font:700 20px/1 var(--body);letter-spacing:.16em;background:var(--accent);color:var(--bg);padding:14px 20px;border-radius:6px}
/* card */
#card{left:980px;top:190px;width:780px;height:640px;background:var(--surface);border-radius:28px;box-shadow:inset 0 0 0 1px rgba(240,242,244,.06);overflow:hidden}
.dots{position:absolute;left:32px;top:30px;display:flex;gap:10px}
.dots i{display:block;width:13px;height:13px;border-radius:50%;background:var(--dim);opacity:.7}
.wf{position:absolute;left:40px;top:84px;width:700px;height:516px}
.ln{position:absolute;height:12px;border-radius:6px;background:var(--line);transform-origin:0 50%}
.ln.g{background:var(--accent)}
.ln.t{height:24px;border-radius:8px;background:rgba(240,242,244,.3)}
.blk{position:absolute;border-radius:14px;background:rgba(240,242,244,.05);box-shadow:inset 0 0 0 1px var(--rule)}
.frame{position:absolute;border-radius:16px;box-shadow:inset 0 0 0 1.5px rgba(240,242,244,.16);overflow:hidden}
.k{position:absolute;font:600 15px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}
.chipl{position:absolute;display:flex;align-items:center;gap:12px;font:500 21px/1 var(--body);color:var(--fg);white-space:nowrap}
.pdot{width:12px;height:12px;border-radius:50%;background:var(--accent);display:block;position:relative}
.pdot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:var(--pr,0);transform:scale(var(--ps,1))}
.tick{position:absolute;width:34px;height:34px;border-radius:9px;box-shadow:inset 0 0 0 1.5px var(--rule-accent)}
.tick svg{position:absolute;inset:0}
/* timeline */
#tl{left:0;top:0;width:1920px;height:1080px}
#tlbase{left:160px;top:937px;width:1600px;height:2px;background:var(--rule)}
#tlfill{left:160px;top:937px;height:2px;background:var(--accent);width:0}
.node{position:absolute;top:930px;width:16px;height:16px;margin-left:-8px;border-radius:50%;box-sizing:border-box;border:2px solid var(--dim);background:var(--bg)}
.node.done{border-color:var(--accent);background:var(--accent)}
.node .pr{position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--accent)}
.nl{position:absolute;top:966px;font:600 16px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.nl b{color:var(--accent);font-weight:600;margin-right:10px}
/* end */
#cta{left:160px;top:748px;display:flex;align-items:center;gap:16px;font:600 40px/1 var(--body);color:var(--accent)}
#ctaul{left:160px;top:804px;height:2px;background:var(--accent);transform-origin:0 50%}
#avail{left:160px;top:888px;display:flex;align-items:center;gap:16px;font:500 26px/1 var(--body);color:var(--fg)}
#url{right:160px;top:890px;font:500 26px/1 var(--body);color:var(--mid)}
img{display:block;max-width:none}
/* controls */
.controls{display:flex;align-items:center;gap:12px;width:min(100%,640px);font:500 13px var(--body);color:var(--mid)}
.controls button{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;background:none;color:var(--accent);border:0;border-bottom:2px solid var(--accent);padding:6px 2px;cursor:pointer;flex:none}
.controls button.ghost{color:var(--fg);border-bottom-color:var(--rule)}
.controls button:focus-visible,.controls input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.controls input{flex:1;min-width:0;accent-color:var(--accent)}
#tclbl{font-variant-numeric:tabular-nums;flex:none;width:6em;text-align:right}
html.render .app,html.embed .app{padding:0;gap:0}
html.render .controls,html.embed .controls{display:none}
html.render .vp,html.embed .vp{border-radius:0;box-shadow:none}
html.embed,html.embed body{background:var(--bg);overflow:hidden}
</style>

</head>

(function(){

const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};

  const img=$('etag'), box=document.createElement('div');

/* W5 */
const CL=E.curve.getTotalLength?E.curve.getTotalLength():900;
E.curve.style.strokeDasharray=CL;

/* W6 care rows */
const CR=FR?[['Mises à jour du contenu','au besoin'],['Sauvegardes','automatiques'],['Sécurité et disponibilité','sous surveillance'],['Hébergement','pris en charge']]
  :[['Content updates','as you need them'],['Backups','automatic'],['Security & uptime','monitored'],['Hosting','handled']];
const crs=CR.map(([a,b],i)=>H(W[5],`<div class="a" style="left:0;top:${i*124}px;width:700px;height:104px;box-shadow:inset 0 -1px 0 var(--rule)"><div class="tick" style="left:0;top:30px;width:44px;height:44px;border-radius:50%">${tickSvg.replace('viewBox="0 0 34 34"','viewBox="-5 -5 44 44"')}</div><div class="a" style="left:72px;top:28px;font:600 30px/1 var(--body)">${a}</div><div class="a" style="left:72px;top:68px;font:400 20px/1 var(--body);color:var(--mid)">${b}</div><div class="a lbl" style="right:0;top:43px;font-size:15px;color:var(--accent)">${tr('Included','Inclus')}</div></div>`));
crs.forEach(r=>r.path=r.querySelector('path'));

function pulse(el,t,speed=1.1){const ph=(t*speed)%1;el.style.setProperty('--pr',(1-ph)*.9);el.style.setProperty('--ps',1+ph*1.6)}
const pdots=[...document.querySelectorAll('.pdot')];

let lastStep=-1;
function R(t){
  /* ring */
  const qa=eio(p(t,2.3,3.2)), qc=eio(p(t,END,END+.8));
  const cx=lerp(lerp(266,1370,qa),1549,qc), cy=lerp(lerp(520,510,qa),449,qc), r=lerp(lerp(190,440,qa),250,qc);
  E.ring.setAttribute('cx',cx);E.ring.setAttribute('cy',cy);E.ring.setAttribute('r',r);
  E.ring.style.strokeDashoffset=-t*18; E.ring.style.opacity=eo(p(t,0,.8));
  E.ring.setAttribute('stroke',`rgba(240,242,244,${lerp(lerp(.12,.06,qa),.13,qc)})`);

  /* intro */
  const io=eio(p(t,2.3,2.8));
  E.intro.style.opacity=1-io; E.intro.style.transform=`translateY(${90-50*io}px)`; E.intro.style.display=io>=1?'none':'';
  const mq=p(t,.1,.8); st(E.imark,eo(mq),0,0,.86+.14*eb(mq),(1-eo(mq))*-40);
  st(E.ikick,eo(p(t,.5,.9)),0,(1-eo(p(t,.5,.9)))*16);
  reveal(E.ihl,t,.65);

  /* frame in/out */
  const fi=eo(p(t,2.55,3.15)), fo=eio(p(t,END,END+.4));
  st(E.hlogo,fi*(1-fo),0,(1-fi)*-20);
  st(E.hstep,fi*(1-fo),0,(1-fi)*-20);
  E.rule.style.transform=`scaleX(${eio(p(t,2.55,3.3))})`; E.rule.style.opacity=1-fo;
  st(E.card,eo(p(t,2.7,3.25))*(1-fo),fo*80,(1-eo(p(t,2.7,3.25)))*60);
  st(E.tl,fi*(1-fo),0,(1-fi)*30);

  /* step index */
  const k=t<S0?0:Math.min(5,Math.floor((t-S0)/SD));
  const sk=sStart(k), lt=t-sk, segLen=k<5?SD:END-CARE;
  if(k!==lastStep){E.title.textContent=STEPS[k].t;E.body.textContent=STEPS[k].b;E.tag.textContent=STEPS[k].g;lastStep=k;
    E.hstep.textContent=k<5?tr(`How it works · Step 0${k+1} / 05`,`Notre façon de faire · Étape 0${k+1} / 05`):tr('How it works · After launch','Notre façon de faire · Après le lancement');}
  const on=t>=S0-.05&&t<END+.4;
  const ti=(d)=>eo(p(lt,d,d+.45)), to=k<5?eio(p(lt,SD-.32,SD)):fo;
  st(E.title,on?ti(0)*(1-to):0,0,(1-ti(0))*34-to*18);
  st(E.body,on?ti(.08)*(1-to):0,0,(1-ti(.08))*34-to*18);
  st(E.tag,on?ti(.16)*(1-to):0,0,(1-ti(.16))*34-to*18);
  /* numeral odometer */
  let pos=0;for(let j=1;j<=5;j++)pos+=eio(p(t,sStart(j)-.35,sStart(j)+.2));
  E.numcol.style.transform=`translateY(${-pos*190}px)`;
  st(E.numwin,eo(p(t,2.75,3.2))*(1-fo),0,0);
  const bq=p(t,CARE+.05,CARE+.45); st(E.badge,eo(bq)*(1-fo),0,0,.7+.3*eb(bq));

  /* card layers */
  W.forEach((w,i)=>{
    const s=sStart(i), len=i<5?SD:END-CARE, l=t-s;
    const vis=l>=0&&l<len+.05;
    if(!vis){w.style.display='none';return}
    w.style.display='';
    const qi=eio(p(l,0,.42)), qo=i<5?eio(p(l,len-.26,len)):0;
    w.style.clipPath=(i===0&&t<S0+.4)||qi>=1?'none':`inset(-80px ${(1-qi)*100}% 0 0)`;
    w.style.opacity=1-qo; w.style.transform=`translateY(${-qo*16}px)`;
  });
  const L=i=>t-sStart(i);
  /* W1 */
  {const l=L(0);
   bars.forEach((b,i)=>{const env=Math.sin(Math.PI*(i+1)/27);const talk=.35+.65*Math.abs(Math.sin(t*2.3));const h=6+46*env*talk*Math.abs(Math.sin(t*7.5+i*.8));b.style.height=h+'px';b.style.top=(28-h/2)+'px'});
   notes.forEach((n,i)=>{n.style.transform=`scaleX(${eo(p(l,.35+i*.22,.75+i*.22))})`});
   goals.forEach((g,i)=>{const s=1.0+i*.32;g.path.style.strokeDashoffset=26*(1-eo(p(l,s,s+.3)));g.ln.style.transform=`scaleX(${eo(p(l,s+.08,s+.5))})`;g.box.style.boxShadow=`inset 0 0 0 1.5px ${l>s?'rgba(242,201,76,.6)':'rgba(242,201,76,.22)'}`});}
  /* W2 */
  {const l=L(1);
   sws.forEach((s,i)=>{const q=p(l,.3+i*.1,.7+i*.1);st(s,eo(q),0,0,.4+.6*eb(q))});
   const a1=eo(p(l,.45,.9));st(E.aa1,a1,0,(1-a1)*24);const a2=eo(p(l,.6,1.05));st(E.aa2,a2,0,(1-a2)*24);
   cols.forEach((c,i)=>{c.style.transform=`scaleY(${eio(p(l,.55+i*.05,1.0+i*.05))})`;c.style.opacity=1-.6*p(l,2.0,2.4)});
   lbs.forEach((b,i)=>{const [, , , ,dx,dy,rot]=LB[i];const q=p(l,.8+i*.14,1.35+i*.14);const e=eb(q);st(b,eo(p(l,.8+i*.14,1.05+i*.14)),dx*(1-e),dy*(1-e),1,rot*(1-e))});}
  /* W3 */
  {const l=L(2);
   ses.forEach((e,i)=>{const q=p(l,.25+i*.1,.7+i*.1);st(e,eo(q),0,(1-eb(q))*-26)});
   st(E.prev,eo(p(l,1.5,1.85)),0,0);}
  /* W4 */
  {const l=L(3);
   const m=eio(p(l,1.05,1.7)), w=lerp(700,250,m);
   E.dev.style.width=w+'px'; E.dev.style.left=((700-w)/2)+'px'; E.dev.style.borderRadius=lerp(16,36,m)+'px';
   E.desk.style.opacity=1-p(m,.15,.55); E.mob.style.opacity=p(m,.45,.9);
   pins.forEach((pn,i)=>{let q,o=1;if(i<2){q=p(l,.4+i*.28,.75+i*.28);o=1-p(l,.95,1.15)}else{q=p(l,1.8+(i-2)*.22,2.1+(i-2)*.22)}st(pn,eo(q)*o,0,0,.5+.5*eb(q))});
   E.round.textContent=tr('Feedback round ','Ronde de commentaires ')+(l<1.5?'1':'2');
   st(E.round,eo(p(l,.3,.6))*(1-.0),0,0);}
  /* W5 */
  {const l=L(4);
   const u=tr('yourbusiness.ca','votreentreprise.ca');E.urlt.textContent=u.slice(0,Math.floor(p(l,.25,.95)*u.length));
   st(E.live,eo(p(l,1.0,1.3)),0,0);
   E.curve.style.strokeDashoffset=CL*(1-eio(p(l,1.05,2.2)));
   E.area.style.opacity=eo(p(l,1.6,2.3)); const cd=p(l,2.1,2.4); E.cdot.style.opacity=eo(cd); E.cdot.setAttribute('r',9*eb(cd)||0.01);}
  /* W6 */
  {const l=L(5);
   crs.forEach((r,i)=>{const q=eo(p(l,.25+i*.16,.7+i*.16));st(r,q,(1-q)*60,0);r.path.style.strokeDashoffset=26*(1-eo(p(l,.6+i*.16,.9+i*.16)))});}

  /* timeline */
  let fx=0;
  if(t>=S0){const nx=k<5?NX[k]+(NX[k+1]-NX[k])*eio(p(lt,SD-.5,SD+.02)):NX[5];fx=nx-160}
  E.tlfill.style.width=Math.max(0,fx)+'px';
  nodes.forEach((n,i)=>{const reached=t>=sStart(i)+.02;n.classList.toggle('done',reached);
    const act=i===k&&t>=S0;const ph=(t*1.2)%1;const pr=n.firstChild;pr.style.opacity=act?(1-ph)*.8:0;pr.style.transform=`scale(${1+ph*.9})`;
    nls[i].style.color=act?'var(--fg)':reached?'var(--mid)':'var(--dim)'});

  /* end */
  const ev=t>=END;
  E.end.style.display=ev?'':'none';
  const eq=eo(p(t,END+.35,END+.85)); st(E.etag,eq,0,(1-eq)*20);
  reveal(E.ehl,t,END+.5);
  const cq=eo(p(t,END+1.2,END+1.6)); st(E.cta,cq,0,(1-cq)*20);
  E.ctaul.style.width=(E.cta.offsetWidth||560)+'px'; E.ctaul.style.transform=`scaleX(${eio(p(t,END+1.55,END+2.1))})`;
  E.arrow.style.transform=`translateX(${t>END+2.1?3*Math.sin((t-END-2.1)*5):0}px)`;
  const aq=eo(p(t,END+1.7,END+2.1)); st(E.avail,aq,0,(1-aq)*14); st(E.url,eo(p(t,END+1.9,END+2.3)),0,0);
  const mq2=p(t,END+.2,END+.9); st(E.emark,eo(mq2),0,0,.86+.14*eb(mq2),(1-eo(mq2))*40);

/* player */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let t=reduce?20.6:0, playing=!reduce, last=null, render=false, visible=true;
const playBtn=$('play'), scrub=$('scrub'), lbl=$('tclbl');
function ui(){playBtn.textContent=playing?'Pause':'Play';scrub.value=t;lbl.textContent=t.toFixed(1)+' / 21 s'}
function fit(){
  if(render)return;
  const app=$('app'),cs=getComputedStyle(app);
  const cw=app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ctr=MODE==='embed'?0:$('controls').offsetHeight+14;
  const ch=app.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-ctr;
  const s=Math.max(.05,Math.min(cw/1920,ch/1080));
  const vp=$('vp');vp.style.width=1920*s+'px';vp.style.height=1080*s+'px';E.stage.style.transform=`scale(${s})`;
}
function loop(ts){
  if(render)return;
  if(last!==null&&playing&&visible){t+=Math.min(.1,(ts-last)/1000);if(t>=DUR)t=0}
  last=ts;R(t);ui();requestAnimationFrame(loop);
}
playBtn.onclick=()=>{playing=!playing;ui()};
$('restart').onclick=()=>{t=0;playing=true;ui()};
scrub.oninput=()=>{t=+scrub.value;playing=false;ui()};
addEventListener('keydown',e=>{if(e.code==='Space'&&!/BUTTON|INPUT/.test(e.target.tagName)){e.preventDefault();playBtn.click()}});
addEventListener('resize',fit);
if('IntersectionObserver'in window)new IntersectionObserver(es=>{visible=es[0].isIntersecting}).observe($('vp'));
window.__render=()=>{render=true;document.documentElement.classList.add('render');const vp=$('vp');vp.style.width='1920px';vp.style.height='1080px';E.stage.style.transform='none'};
window.__seek=x=>{lastStep=-1;R(x)};
fit();R(t);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{fit();lastStep=-1;R(t)});
requestAnimationFrame(loop);
})();
