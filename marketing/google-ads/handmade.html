<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&family=Figtree:wght@400;500;600&display=block"><link rel="stylesheet" href="_base.css"><title>Ad: Built by hand</title><style>
.copy{max-width:520px;}

</div>
