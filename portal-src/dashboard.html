<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/img/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/img/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>Your Files — Mann Dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="portal-bar">
    <a href="https://manndev.com/" class="portal-wordmark"><img src="/img/logo.png" alt="Mann Dev" width="345" height="106"><span>Client Portal</span></a>
    <div class="portal-account">
      <span class="portal-account-email" id="account-name"></span>
      <button class="portal-logout" id="pw-open-btn" type="button" hidden>Change password</button>
      <button class="portal-logout" id="logout-btn" type="button">Log out</button>
    </div>
  </div>

  <main class="portal-main" id="main">
    <div class="dash-state" id="loading-state">Loading your files…</div>
  </main>

  <dialog class="pw-dialog" id="pw-dialog" aria-labelledby="pw-heading">
    <div class="pw-dialog-head">
      <h2 class="pw-dialog-title" id="pw-heading">Change password</h2>
      <button type="button" class="pw-dialog-close" id="pw-close-btn" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p class="dash-note pw-dialog-note">Signed in as <strong id="pw-username"></strong>. Your username stays the same.</p>
    <form id="pw-form" novalidate>
      <input type="text" name="username" id="pw-username-field" autocomplete="username" hidden>
      <div class="field">
        <label class="field-label" for="pw-current">Current password</label>
        <input type="password" id="pw-current" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label class="field-label" for="pw-new">New password (at least 10 characters)</label>
        <input type="password" id="pw-new" autocomplete="new-password" minlength="10" required>
      </div>
      <div class="field">
        <label class="field-label" for="pw-confirm">Confirm new password</label>
        <input type="password" id="pw-confirm" autocomplete="new-password" required>
      </div>
      <button type="submit" class="link-cta" id="pw-submit">
        <span id="pw-submit-label">Update password</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        <div class="cta-underline-wrap"><div class="cta-underline"></div></div>
      </button>
      <p class="login-status" id="pw-status" role="status" aria-live="polite"></p>
    </form>
  </dialog>

  <script type="module" src="/src/dashboard.ts"></script>
</body>
</html>
