<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/img/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/img/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>Portal — Mann Dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="portal-bar">
    <a href="https://manndev.com/" class="portal-wordmark portal-wordmark--solo"><img src="/img/logo.png" alt="Mann Dev" width="298" height="59"></a>
    <span class="login-dateline">Client Access</span>
  </div>

  <main class="login-main">
    <div class="login-content">
      <h1 class="login-title">Sign in</h1>
      <p class="login-aside">Enter the username and password you were given to access the portal.</p>

      <form id="login-form" method="post" novalidate>
        <div class="field">
          <label class="field-label" for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required>
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="link-cta" id="submit-btn">
          <span id="submit-label">Enter portal</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          <div class="cta-underline-wrap"><div class="cta-underline"></div></div>
        </button>
        <p class="login-status" id="status" role="status" aria-live="polite"></p>
      </form>

      <p class="login-foot">Don't have a login yet? <a href="https://manndev.com/#contact">Get in touch</a> about your project.</p>
      <p class="login-foot login-admin-link"><a href="./admin.html">Admin</a></p>
    </div>
  </main>

  <script type="module" src="/src/login.ts"></script>
</body>
</html>
