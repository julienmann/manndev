<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/portal/favicon.svg" />
<title>Client Portal — Mann Dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/portal/assets/main-Brk1D2Aw.js"></script>
  <link rel="modulepreload" crossorigin href="/portal/assets/style-Cvzz0x0f.js">
  <link rel="modulepreload" crossorigin href="/portal/assets/session-ooeDBbmF.js">
  <link rel="stylesheet" crossorigin href="/portal/assets/style-CwD4sPNf.css">
</head>
<body>
  <div class="portal-bar">
    <a href="https://dev.julienmann.ca/" class="portal-wordmark">Mann Dev<span>Client Portal</span></a>
    <span class="login-dateline">Client Access</span>
  </div>

  <main class="login-main">
    <div class="login-content">
      <h1 class="login-title">Sign in</h1>
      <p class="login-aside">Enter the 4-digit access code you were given to download your files.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label class="field-label" for="pin">Access code</label>
          <input type="text" id="pin" name="pin" class="field-pin" placeholder="••••" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" autofocus required>
        </div>
        <button type="submit" class="link-cta" id="submit-btn">
          <span id="submit-label">Enter portal</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          <div class="cta-underline-wrap"><div class="cta-underline"></div></div>
        </button>
        <p class="login-status" id="status" role="status" aria-live="polite"></p>
      </form>

      <p class="login-foot">Don't have a code yet? <a href="https://dev.julienmann.ca/#contact">Get in touch</a> about your project, I read these myself.</p>
      <p class="login-foot login-admin-link"><a href="./admin.html">Admin</a></p>
    </div>
  </main>

</body>
</html>
